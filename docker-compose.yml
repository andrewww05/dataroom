# Local infrastructure only: Postgres for rows, MinIO for blobs.
# The apps themselves run on the host with `pnpm dev` — nothing else is containerised.
#
#   docker compose up -d
#   pnpm --filter @dataroom/api exec prisma migrate dev
#
# MinIO console: http://localhost:9001 (minioadmin / minioadmin)
# The `dataroom` bucket is created by the API on boot, so there is no manual setup step.

services:
  db:
    image: postgres:17
    container_name: dataroom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataroom
      POSTGRES_USER: dataroom
      POSTGRES_PASSWORD: dataroom
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dataroom -d dataroom']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: dataroom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # 9000 is the S3 API — presigned URLs are signed against this host, so it stays
      # localhost-reachable and is never a container-internal hostname.
      - '9000:9000'
      # 9001 is the web console.
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  minio-data:
